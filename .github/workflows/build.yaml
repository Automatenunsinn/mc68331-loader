name: Build
on:
  [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/stoneddiscord/m68k_bare_metal:master
    strategy:
      matrix:
        version: [50B_1MB, 50B_2MB, 50A_1MB, ALT_1MB, UHG_1MB, ROTE_512KB, TEST_1MB]
    steps:
    - uses: actions/checkout@v6
    - name: Build
      run: |
        make crt
        make VERSION=${{ matrix.version }} xc
    - name: Rename artifact
      run: mv Loader.xc Loader-${{ matrix.version }}.xc
    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: Loader-${{ matrix.version }}
        path: Loader-${{ matrix.version }}.xc

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v6
      with:
        path: artifacts

    - name: Build release zip
      run: |
        mkdir -p release
        find artifacts -type f -name "*.xc" -exec cp {} release/ \;
        cd release
        zip -r ../Loaders.zip .

    - name: Update release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: mt
        files: |
          Loaders.zip
          release/*.xc
